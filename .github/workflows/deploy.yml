name: Deploy JustiTeX site

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify landing contracts
        run: |
          set -euo pipefail
          test -f index.html
          grep -q 'buy.stripe.com/dRm00cgtQaY20Cf3eS6J201' index.html
          grep -q 'github.com/Executive-Function-OS/JustiTeX' index.html
          grep -q 'Clinic license' index.html
          grep -q '@media print' index.html
          if grep -q 'YourUsername' index.html; then echo 'placeholder GitHub URL'; exit 1; fi
          if grep -q 'justitex-oregon-template-pack.zip' index.html; then echo 'broken zip still linked'; exit 1; fi

  pages:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html success.html _site/
          if [ -f JustiTeX_Pro_Oregon_Template_Pack_v2.0.zip ]; then
            cp JustiTeX_Pro_Oregon_Template_Pack_v2.0.zip _site/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
